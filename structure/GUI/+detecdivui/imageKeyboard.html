<!doctype html>
<html lang="en"><head><meta charset="utf-8"></head><body><script>
// R2026a FigureDocument boundary. Listen only to this figure's image canvas;
// native editors, sliders, trees, menus and custom widgets retain their keys.
function setup(component) {
    let state = {}, owner = null, sequence = 0, focusedRequest = 0;
    function keydown(event) {
        const frame = window.frameElement;
        const scope = frame && frame.closest('.gbtFigureLayoutContainer');
        const target = event.target;
        // MATLAB focuses the figure container after an image click/redraw.
        // The canvas's fallback div cannot itself receive browser focus.
        // A newly floated Image document initially focuses its window body.
        const floatingBackground = scope && target === owner.body &&
            owner.querySelectorAll('.gbtFigureLayoutContainer').length === 1 &&
            scope.getBoundingClientRect().width > 0;
        const imageButton = target && target.closest('[role="button"],button') &&
            !target.closest('[role="toolbar"],.gbtFigureToolsContainer');
        const imageTarget = floatingBackground || target && (target.closest('.GraphicsView') ||
            target.matches('.gbtFigureLayoutContainer,.gbtFigureFrame') || imageButton);
        if (!state.enabled || !scope || !(scope.contains(target) || floatingBackground) ||
            !imageTarget || event.defaultPrevented || event.isComposing ||
            event.altKey || event.shiftKey) return;
        // Physical keypad positions keep working with Num Lock off (End,
        // Home, Clear...). Ordinary navigation keys keep their native role.
        const keypad = /^Numpad([0-9])$/.exec(event.code || '');
        const raw = keypad ? keypad[1] : event.key.toLowerCase();
        const key = ({arrowleft:'leftarrow',arrowright:'rightarrow',arrowup:'uparrow',
            arrowdown:'downarrow',enter:'return',' ':'space'})[raw] || raw;
        const ctrl = event.ctrlKey || event.metaKey;
        if (ctrl ? !(state.ctrlKeys || []).includes(key) : !state.keys.includes(key)) return;
        event.preventDefault(); event.stopPropagation();
        // Keep configuration in Data: a floating document can reload this iframe.
        component.Data = {...state, action:'key', key, ctrl, sequence:++sequence};
    }
    function unbind() {
        if (owner) owner.removeEventListener('keydown',keydown,true);
        owner = null;
    }
    function update() {
        const incoming = component.Data;
        sequence = Math.max(sequence, Number(incoming && incoming.sequence) || 0);
        if (incoming && Array.isArray(incoming.keys)) state = incoming;
        const current = window.frameElement && window.frameElement.ownerDocument;
        if (current !== owner) {
            unbind(); owner = current;
            if (owner) owner.addEventListener('keydown',keydown,true);
        }
        const requested = Number(state.focusRequest) || 0;
        const scope = window.frameElement && window.frameElement.closest('.gbtFigureLayoutContainer');
        if (state.enabled && requested > focusedRequest && scope && scope.getBoundingClientRect().width > 0) {
            scope.focus({preventScroll:true}); focusedRequest = requested;
        }
    }
    component.addEventListener('DataChanged',update);
    window.addEventListener('beforeunload',unbind);
    update();
    document.body.dataset.ready = 'true';
}
</script></body></html>
