<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;font:12px Arial,sans-serif;color:#252a30;overflow:hidden;background:transparent}
body{display:flex;align-items:center;gap:8px} #message{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
progress{width:76px;height:9px;accent-color:#2779b5;flex-shrink:0}progress::-webkit-progress-bar{background:#dce4ea;border-radius:3px}
progress::-webkit-progress-value{background:#2779b5;border-radius:3px}
progress:indeterminate{background:linear-gradient(90deg,#dce4ea 0%,#2779b5 50%,#dce4ea 100%);background-size:200% 100%;animation:busy 1.3s linear infinite;border-radius:3px}
progress:indeterminate::-webkit-progress-bar{background:transparent}
@keyframes busy{to{background-position:-200% 0}}
</style></head><body><span id="message" role="status" aria-live="polite"></span><progress aria-label="Operation progress" max="1"></progress>
<script>
function setup(component){
 const message=document.getElementById('message'),bar=document.querySelector('progress');
 function render(){const d=component.Data||{};message.textContent=d.message||'';message.title=message.textContent;
 if(d.known){bar.value=d.value;bar.title=Math.round(100*d.value)+'%';}else{bar.removeAttribute('value');bar.title='Working';}}
 component.addEventListener('DataChanged',render);render();
}
</script></body></html>
