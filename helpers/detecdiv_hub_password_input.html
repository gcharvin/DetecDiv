<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; }
input { box-sizing: border-box; width: 100%; height: 100%; padding: 3px 7px;
        border: 1px solid #767676; border-radius: 2px; font: 14px sans-serif; }
input:focus { outline: 1px solid #0072bd; outline-offset: -1px; }
</style>
</head>
<body>
<input id="password" type="password" autocomplete="current-password" aria-label="Hub password">
<script>
function setup(htmlComponent) {
    const input = document.getElementById('password');
    input.addEventListener('input', () => { htmlComponent.Data = input.value; });
    htmlComponent.addEventListener('DataChanged', () => {
        if (htmlComponent.Data && htmlComponent.Data.clear) input.value = '';
    });
}
</script>
</body>
</html>
