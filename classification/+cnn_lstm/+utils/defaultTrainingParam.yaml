params:
  - name: train_CNN_classifier
    value: true
    tip: Check box to train CNN
  - name: compute_CNN_activations
    value: true
    tip: Check box to compute CNN activations
  - name: train_LSTM_network
    value: true
    tip: Check box to train the LSTM network
  - name: assemble_network
    value: true
    tip: Check box to asssemble the CNN and LSTM networks
  - name: classifier_output
    value: [sequence-to-sequence, sequence-to-one]
    default: sequence-to-sequence
    tip: Specify if each frame should be classified, or if one class is expected for the whole sequence of images
  - name: CNN_training_method
    value: [adam, sgdm]
    default: adam
    tip: Choose the training method
  - name: CNN_network
    value: [googlenet, inceptionresnetv2, inceptionv3, resnet50, resnet18]
    default: googlenet
    tip: Choose the CNN
  - name: CNN_mini_batch_size
    value: 8
    tip: Choose the size of the mini batch; Higher values require more memory and are prone to errors
  - name: CNN_max_epochs
    value: 6
    tip: Enter the number of epochs
  - name: CNN_initial_learning_rate
    value: 0.0001
    tip: Enter the initial learning rate
  - name: CNN_learn_rate_drop_factor
    value: 0.9
    tip: Enter the learning rate drop factor
  - name: CNN_data_shuffling
    value: [once, every-epoch, never]
    default: every-epoch
    tip: Choose whether and how training and validation data should be shuffled during training
  - name: CNN_data_splitting_factor
    value: 0.7
    tip: Enter fraction of the data to be used for training vs validation during training
  - name: CNN_translation_augmentation
    value: [-5, 5]
    tip: Enter the magnitude of translation for data augmentation (in pixels)
  - name: CNN_rotation_augmentation
    value: [-5, 5]
    tip: Enter the magnitude of rotation for data augmentation (in degrees)
  - name: CNN_l2_regularization
    value: 1e-05
    tip: Specify value for L2 regularization
  - name: CNN_use_dropout
    value: true
    tip: Check to use a dropout layer
  - name: CNN_dropout
    value: 0.5
    tip: Value for dropout regularization
  - name: CNN_rand_scale
    value: [0.8, 1.0]
    tip: Range of random scale factor for CNN augmentation (e.g. [0.8 1.0])
  - name: CNN_rand_flip
    value: true
    tip: Enable random flips (left/right & up/down) during CNN augmentation
  - name: CNN_crop_scale
    value: [0.8, 1.0]
    tip: Crop-in scale range for CNN augmentation (e.g. [0.8 1.0])
  - name: CNN_contrast_range
    value: [1, 1]
    tip: Contrast multiplier range for CNN augmentation (e.g. [0.85 1.15])
  - name: CNN_brightness_range
    value: [0, 0]
    tip: Brightness offset range (additive, e.g. [-0.10 0.10])
  - name: CNN_gamma_range
    value: [1, 1]
    tip: Gamma exponent range for CNN augmentation (e.g. [0.9 1.1])
  - name: CNN_saturation_range
    value: [1, 1]
    tip: Saturation multiplier range (RGB only, e.g. [0.95 1.05])
  - name: CNN_hue_delta
    value: 0
    tip: Maximum hue jitter (0-0.5, small values recommended)
  - name: CNN_noise_sigma
    value: 0
    tip: Std-dev of Gaussian noise for CNN augmentation (set 0 to disable)
  - name: CNN_defocus_sigma_range
    value: [0, 0]
    tip: Defocus sigma range in pixels (e.g. [0.3 1.0])
  - name: CNN_defocus_prob
    value: 0
    tip: Probability to apply defocus blur (e.g. 0.5)
  - name: LSTM_data_splitting_factor
    value: 0.9
    tip: Choose the fraction of the data to be used for training vs validation during LSTM training
  - name: LSTM_hidden_size
    value: 150
    tip: Enter the size of the hidden unit
  - name: LSTM_mini_batch_size
    value: 8
    tip: Choose the size of the mini batch for LSTM training; Higher values require more memory and are prone to errors
  - name: LSTM_initial_learning_rate
    value: 1e-04
    tip: Enter the LSTM initial learning rate
  - name: LSTM_max_epochs
    value: 50
    tip: Enter the number of epochs for LSTM training
  - name: LSTM_sequence_length
    value: 40
    tip: Enter the length of the sequences in frames; put 0 if all frames should be used upon training
  - name: LSTM_learn_rate_drop_factor
    value: 0.9
    tip: Enter the dropping factor in learning rate
  - name: execution_environment
    value: [auto, parallel, cpu, gpu, multi-gpu]
    default: auto
    tip: Choose execution environment
  - name: transfer_learning
    value: [ImageNet]
    default: ImageNet
    tip: Select initial version of network to start training with; Default: ImageNet
  - name: LSTM_minority_mode
    value: none
    tip: Minority balancing mode (none/auto)
  - name: LSTM_minority_min_ratio
    value: 0.3
    tip: Activate balancing if min/max ratio <= this value
  - name: LSTM_minority_percentile
    value: 0.0
    tip: Percentile for multi-minority selection (0=off)
  - name: LSTM_pos_neg_ratio
    value: 1.0
    tip: #Negatives per #Positives windows (e.g. 1 = 1:1)
  - name: LSTM_win_stride_pos_frac
    value: 0.1
    tip: Positive window stride as a fraction of L
  - name: LSTM_win_stride_neg_frac
    value: 1.0
    tip: Negative window stride as a fraction of L
  - name: LSTM_keep_valid_distrib
    value: true
    tip: Keep validation distribution unbalanced (true/false)
  - name: Format_Fraction
    value: 1.0
    tip: Fraction of ROIs used when formatting the LSTM training set
  - name: Format_Seed
    value: 12345
    tip: Random seed used when sampling ROIs / frames for formatting
  - name: Format_Crop
    value: false
    tip: Enable cropping when formatting the LSTM training set (true/false)
  - name: Format_CropCenter
    value: [88, 194]
    tip: Crop center [cx cy] used for formatting the LSTM training set
  - name: Format_CropSize
    value: [60, 60]
    tip: Crop size [w h] used for formatting the LSTM training set
  - name: Format_UndersampleMajority
    value: 1.0
    tip: Undersample majority classes (1 = no undersampling)
  - name: Format_StorageBackend
    value: [hdf5, tiff]
    default: hdf5
    tip: Storage backend for formatted data ('hdf5' or 'tiff')
